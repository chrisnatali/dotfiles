# AeroSpace configuration
# ---------------------------------------------------------------------------
# Modeled after ~/src/dotfiles/.xmonad/xmonad.hs so it feels like xmonad on
# macOS. xmonad's mod key is Super (mod4Mask); on the Mac the equivalent role
# is played by `alt` (Option), which is also what .skhdrc/.yabairc already use.
#
# Headline feature you asked for: move ALL windows in a space from one monitor
# to another. That's `move-workspace-to-monitor` (see alt-shift-o below).
# AeroSpace's "named workspaces" carry all their windows with them, so moving a
# workspace to another monitor moves the whole space at once -- the closest
# analog to xmonad's greedy-view screen model.
#
# Reload after editing:  alt-shift-r  (or `aerospace reload-config`)
# ---------------------------------------------------------------------------

# Start AeroSpace at login (replaces xmonad being launched from .xinitrc).
start-at-login = true

# Normalizations keep the tiling tree tidy, similar to how xmonad's Tall/
# ThreeCol layouts always produce a clean arrangement.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# 'tiles' with 'auto' orientation ~ xmonad's Tall (splits the long screen edge).
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

accordion-padding = 30

# Follow the mouse to the newly focused monitor (nice with multi-monitor moves).
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# xmonad had no gaps; keep it tight. Bump these if you want breathing room.
[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

[key-mapping]
preset = 'qwerty'

# ===========================================================================
# Main mode -- the default bindings
# ===========================================================================
[mode.main.binding]

# --- Layouts (xmonad: mod-space cycles Tall / Mirror Tall / Full / ThreeCol) -
alt-slash = 'layout tiles horizontal vertical'      # toggle H/V tiling (Tall <-> Mirror Tall)
alt-comma = 'layout accordion horizontal vertical'  # accordion (stacked) layout
# Below conflicts with alt-f for forward word in terminal
# alt-f = 'fullscreen'                                 # ~ xmonad Full layout (mod-space -> Full)
alt-t = 'layout floating tiling accordion'                     # ~ xmonad mod-t: toggle float/tile for window

# --- Focus windows (xmonad: mod-j/mod-k; using vim hjkl as in your .skhdrc) --
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# --- Move windows within a space (xmonad: mod-shift-j/mod-shift-k) -----------
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# --- Resize (xmonad: mod-h/mod-l shrink/grow master) ------------------------
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# --- Workspaces 1-9 (xmonad: mod-[1..9] view workspace N) -------------------
# `summon-workspace` reproduces xmonad's default mod-[N] greedyView exactly:
# it pulls workspace N onto the monitor you're focused on (swapping out what
# was there) and focuses it. AeroSpace's own docs say its behavior "is
# identical to Xmonad". If you'd instead rather jump focus to N's existing
# monitor without moving it, swap these for e.g. `alt-1 = 'workspace 1'`.
alt-1 = 'summon-workspace 1'
alt-2 = 'summon-workspace 2'
alt-3 = 'summon-workspace 3'
alt-4 = 'summon-workspace 4'
alt-5 = 'summon-workspace 5'
alt-6 = 'summon-workspace 6'
alt-7 = 'summon-workspace 7'
alt-8 = 'summon-workspace 8'
alt-9 = 'summon-workspace 9'
alt-backtick = 'workspace-back-and-forth'               # jump to previous workspace (moved off alt-tab, which bb terminal uses)

# --- Move focused window to a workspace (xmonad: mod-shift-[1..9]) ----------
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# --- Monitors (xmonad: mod-w/e focus screens; mod-shift-w/e move window) ----
# --wrap-around makes these toggle back and forth on a 2-monitor setup.
alt-w = 'focus-monitor --wrap-around prev'
alt-e = 'focus-monitor --wrap-around next'
alt-shift-w = 'move-node-to-monitor --wrap-around --focus-follows-window prev'  # send window to prev monitor
alt-shift-e = 'move-node-to-monitor --wrap-around --focus-follows-window next'  # send window to next monitor

# --- Window / session management -------------------------------------------
alt-shift-c = 'close'                                          # xmonad mod-shift-c: close window
alt-shift-r = 'reload-config'                                  # xmonad mod-q: recompile/restart

# -- iTerm and Chrome quick launch new windows
alt-shift-enter = "exec-and-forget osascript -e 'tell application \"iTerm\" to create window with default profile'"
alt-g = "exec-and-forget osascript -e 'tell application \"Google Chrome\" to make new window'"


# Move Bloomberg Citrix windows to space 1 and float them
alt-ctrl-c = '''exec-and-forget aerospace list-windows --monitor all --app-bundle-id com.citrix.receiver.icaviewer.mac --format '%{window-id}' | while read -r id; do aerospace layout --window-id "$id" floating; aerospace move-node-to-workspace --window-id "$id" 1; done'''

# Enter "service" mode for less-common actions (see below).
alt-shift-semicolon = 'mode service'

# ===========================================================================
# Service mode -- press alt-shift-semicolon to enter, esc to leave
# ===========================================================================
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']   # reset the layout tree (~ xmonad mod-shift-space)
f = ['layout floating tiling', 'mode main']   # toggle floating
# Balance window sizes
b = ['balance-sizes', 'mode main']

# Tile all windows in current workspace
t = [
    '''exec-and-forget aerospace list-windows --workspace focused --format '%{window-id}' | xargs -I {} aerospace layout --window-id {} tiling''',
    'layout --root tiles horizontal',
    'balance-sizes',
    'mode main',
]

backspace = ['close-all-windows-but-current', 'mode main']

# Re-join a window into a container in a given direction, then return to main.
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']


# TILING: AeroSpace auto-floats any window that lacks a native macOS fullscreen
# (green zoom) button -- its "dialog heuristic". Citrix's BBA session windows
# are Windows windows wrapped by Citrix, so they have no such button and get
# floated by default.
#
# GLITCHY DROPDOWNS FIX: Citrix/BBA spawns transient popups (Bloomberg
# autocomplete dropdowns, tooltips, etc.) as SEPARATE macOS windows titled
# 'wdmm-Win32Window'. If the rule moves those popups too, AeroSpace drags them
# into the tiling tree and forces a resize; Bloomberg then redraws the dropdown,
# AeroSpace re-detects and re-grabs it, and you get the "disappears and
# reappears" flicker.
#
# The window-title regex excludes those popups from the move. It's an inverted
# match: '^(?!.*wdmm-Win32Window).*' matches any title that does NOT contain
# 'wdmm-Win32Window'. The '^' anchor pins the match to the start of the string
# (ICU regex, non-multiline), turning AeroSpace's substring search into a
# whole-title test, and the negative lookahead does the exclusion. Excluded
# popups fall through to AeroSpace's default heuristic, which floats windows
# lacking a native fullscreen button (Citrix's wrapped popups qualify).
#
# If dropdowns still flicker, confirm the popup title while one is open:
#   aerospace list-windows --all | grep -i citrix
# and, if needed, add a separate block ABOVE this one that matches the popup
# title and runs 'layout floating' explicitly.
# ===========================================================================
[[on-window-detected]]
if.app-id = 'com.citrix.receiver.icaviewer.mac'
if.window-title-regex-substring = '^(?!.*wdmm-Win32Window).*'
run = ['layout floating']


# ===========================================================================
# Optional: pin certain workspaces to a preferred monitor on connect.
# You wanted spaces to be movable, so this is left commented. Monitor keys can
# be a name regex or 'main'/'secondary'. Example:
# ===========================================================================
# [workspace-to-monitor-force-assignment]
# 1 = 'main'
# 2 = 'main'
# 9 = 'secondary'
